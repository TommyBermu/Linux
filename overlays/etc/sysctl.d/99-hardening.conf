# Hardening del kernel via sysctl. Se aplica en cada arranque (systemd lee los
# archivos de /etc/sysctl.d/ por orden; 99- corre al final y tiene prioridad).
#
# Criterio: solo valores seguros para ESTE escritorio, que usa Docker, libvirt/
# virt-manager y linux-wifi-hotspot. Por eso NO se toca net.ipv4.ip_forward
# (debe quedar en 1: lo necesitan las redes de contenedores y VMs; ponerlo en 0
# las romperia). Varios valores ya vienen asi por defecto en Arch/CachyOS; se
# fijan explicitamente para que no dependan de un default que pueda cambiar.
#
# Revertir: borra este archivo y reinicia (o: sysctl --system). Excepcion:
# kexec_load_disabled no se puede revertir sin reiniciar (ver nota abajo).

# --- Exposicion de informacion del kernel ----------------------------------
# Oculta las direcciones de punteros del kernel a procesos sin privilegios
# (se las da mas dificil a un exploit para localizar su objetivo).
kernel.kptr_restrict = 2

# Solo root puede leer el buffer del kernel (dmesg); evita filtrar info util
# para atacar. Ya suele estar en 1; se fija explicitamente.
kernel.dmesg_restrict = 1

# Limita el acceso a perf_event (subsistema con historial de exploits locales).
kernel.perf_event_paranoid = 2

# --- Carga de codigo en el kernel ------------------------------------------
# Impide cargar otro kernel en caliente con kexec. OJO: una vez en 1 NO se puede
# volver a 0 sin reiniciar. Este equipo no usa kexec (la hibernacion va por
# resume=, no por kexec), asi que es seguro.
kernel.kexec_load_disabled = 1

# Cierra el uso de BPF por usuarios sin privilegios (vector de exploits).
kernel.unprivileged_bpf_disabled = 2

# --- Aislamiento entre procesos --------------------------------------------
# Un proceso solo puede usar ptrace sobre sus hijos; impide que un programa
# comprometido espie la memoria de otros procesos del mismo usuario. El valor 1
# es el equilibrado (no rompe depuradores lanzados desde el propio proceso).
kernel.yama.ptrace_scope = 1

# --- Red: anti-spoofing y anti-MITM ----------------------------------------
# Rechaza paquetes con IP de origen que no podria venir por esa interfaz
# (anti-spoofing). Ya suele estar en 1.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignora redirecciones ICMP (un atacante en la red podria usarlas para MITM).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# No enviar redirecciones ICMP (este equipo no es un router).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# No aceptar rutas de origen (source routing), tecnica de spoofing.
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Protege contra SYN flood sin mantener estado por conexion a medias.
net.ipv4.tcp_syncookies = 1

# Registra paquetes con direcciones imposibles (marcianos); util para detectar
# spoofing en la red.
net.ipv4.conf.all.log_martians = 1
